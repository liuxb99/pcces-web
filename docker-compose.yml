version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pcces
      POSTGRES_PASSWORD: pcces123
      POSTGRES_DB: pcces
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcces"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
