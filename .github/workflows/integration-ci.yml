name: PCCES Integration CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall api
      - name: Import integration app
        env:
          PCCES_DATABASE_URL: sqlite:////tmp/pcces-integration.db
        run: python -c "from api.integration_app import app; print(app.url_map)"
      - name: Run API tests
        env:
          PCCES_DATABASE_URL: sqlite:////tmp/pcces-test.db
        run: pytest -q api
