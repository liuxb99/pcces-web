name: Decimal Core Integration

on:
  push:
    paths:
      - "api/bid_*.py"
      - "api/budget_*.py"
      - "api/mrs_*.py"
      - "api/resource_*.py"
      - "api/legacy_*.py"
      - "api/test_bid_*.py"
      - "api/test_budget_*.py"
      - "api/test_mrs_*.py"
      - "api/test_resource_*.py"
      - "api/test_legacy_*.py"
      - "api/route_policy.py"
      - "api/app.py"
      - "web-pcces/frontend/src/pages/*.tsx"
      - "web-pcces/frontend/src/App.tsx"
      - "pcces-go/internal/domain/money/**"
      - "pcces-go/internal/storage/sqlite/bid_*"
      - "pcces-go/internal/storage/sqlite/budget_*"
      - "pcces-go/internal/storage/sqlite/mrs_*"
      - "pcces-go/internal/storage/sqlite/resource_*"
      - "pcces-go/internal/storage/sqlite/dependency_*"
      - "pcces-go/internal/storage/sqlite/migrations/00*"
      - "pcces-go/internal/platform/httpapi/*bid*"
      - "pcces-go/internal/platform/httpapi/*budget*"
      - "pcces-go/internal/platform/httpapi/*mrs*"
      - "pcces-go/internal/platform/httpapi/decimal_core_handlers.go"
      - "pcces-go/internal/platform/httpapi/authorization_handlers.go"
      - ".github/workflows/decimal-core-integration.yml"
  pull_request:
    paths:
      - "api/bid_*.py"
      - "api/budget_*.py"
      - "api/mrs_*.py"
      - "api/resource_*.py"
      - "api/legacy_*.py"
      - "api/test_bid_*.py"
      - "api/test_budget_*.py"
      - "api/test_mrs_*.py"
      - "api/test_resource_*.py"
      - "api/test_legacy_*.py"
      - "api/route_policy.py"
      - "api/app.py"
      - "web-pcces/frontend/src/pages/*.tsx"
      - "web-pcces/frontend/src/App.tsx"
      - "pcces-go/internal/domain/money/**"
      - "pcces-go/internal/storage/sqlite/bid_*"
      - "pcces-go/internal/storage/sqlite/budget_*"
      - "pcces-go/internal/storage/sqlite/mrs_*"
      - "pcces-go/internal/storage/sqlite/resource_*"
      - "pcces-go/internal/storage/sqlite/dependency_*"
      - "pcces-go/internal/storage/sqlite/migrations/00*"
      - "pcces-go/internal/platform/httpapi/*bid*"
      - "pcces-go/internal/platform/httpapi/*budget*"
      - "pcces-go/internal/platform/httpapi/*mrs*"
      - "pcces-go/internal/platform/httpapi/decimal_core_handlers.go"
      - "pcces-go/internal/platform/httpapi/authorization_handlers.go"
      - ".github/workflows/decimal-core-integration.yml"

jobs:
  web-decimal-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Web decimal core tests
        run: >-
          python -m unittest
          api.test_decimal_math
          api.test_bid_lifecycle
          api.test_budget_decimal
          api.test_budget_calculation_trace
          api.test_budget_versioning
          api.test_budget_approval
          api.test_budget_validation
          api.test_budget_cross_project_sync
          api.test_mrs_catalog
          api.test_mrs_code
          api.test_mrs_intelligence
          api.test_mrs_operations
          api.test_mrs_governance
          api.test_mrs_governance_frontend_contract
          api.test_resource_decimal
          api.test_resource_budget_lineage
          api.test_resource_budget_links
          api.test_resource_dependency_graph
          api.test_legacy_resource_decimal_bridge
          api.test_legacy_decimal_adapter
          api.test_route_policy

  frontend-decimal-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-pcces/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-pcces/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  go-decimal-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcces-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: pcces-go/go.sum
      - name: Format check
        run: test -z "$(gofmt -l internal/domain/money internal/storage/sqlite internal/platform/httpapi)"
      - name: Run Go decimal core tests
        run: go test ./internal/domain/money/... ./internal/storage/sqlite/... ./internal/platform/httpapi/...
      - name: Run Go vet
        run: go vet ./...
