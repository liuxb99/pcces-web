name: Phase 0 Persistence Parity

on:
  push:
    paths:
      - "api/decimal_math.py"
      - "api/persistence_contract.py"
      - "api/migrations.py"
      - "api/app.py"
      - "api/test_decimal_math.py"
      - "api/test_persistence_contract.py"
      - "api/test_migrations.py"
      - "pcces-go/internal/domain/money/**"
      - "pcces-go/internal/storage/sqlite/decimal_repository*"
      - "pcces-go/internal/storage/sqlite/migrations/0006_decimal_audit_contract.sql"
      - "specs/golden/decimal-calculations.json"
      - "specs/catalog/phase0-persistence-contract.json"
      - ".github/workflows/phase0-persistence-parity.yml"
  pull_request:
    paths:
      - "api/decimal_math.py"
      - "api/persistence_contract.py"
      - "api/migrations.py"
      - "api/app.py"
      - "api/test_decimal_math.py"
      - "api/test_persistence_contract.py"
      - "api/test_migrations.py"
      - "pcces-go/internal/domain/money/**"
      - "pcces-go/internal/storage/sqlite/decimal_repository*"
      - "pcces-go/internal/storage/sqlite/migrations/0006_decimal_audit_contract.sql"
      - "specs/golden/decimal-calculations.json"
      - "specs/catalog/phase0-persistence-contract.json"
      - ".github/workflows/phase0-persistence-parity.yml"

jobs:
  web-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run Web persistence tests
        run: >-
          python -m unittest
          api.test_decimal_math
          api.test_persistence_contract
          api.test_migrations

  go-persistence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcces-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: pcces-go/go.sum
      - name: Format check
        run: test -z "$(gofmt -l internal/domain/money internal/storage/sqlite/decimal_repository.go internal/storage/sqlite/decimal_repository_test.go)"
      - name: Run Go persistence tests
        run: go test ./internal/domain/money/... ./internal/storage/sqlite/...
      - name: Run Go vet
        run: go vet ./...
