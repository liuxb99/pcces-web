name: Phase 5-9 Completion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m unittest discover -s api -p "test_*.py"
      - run: PYTHONPATH=. python scripts/phase9_legacy_catalog.py --require-no-unknown
      - run: PYTHONPATH=. python scripts/production_readiness.py
      - run: PYTHONPATH=. python scripts/phase9_gate.py --require-complete
      - uses: actions/upload-artifact@v4
        with:
          name: phase9-legacy-catalog
          path: build/phase9-legacy-catalog.json

  local-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcces-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: pcces-go/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-pcces/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-pcces/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  postgresql-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcces
          POSTGRES_PASSWORD: pcces123
          POSTGRES_DB: pcces
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcces -d pcces"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: pcces123
      DATABASE_URL: postgresql://pcces:pcces123@localhost:5432/pcces
      RESTORE_DATABASE_URL: postgresql://pcces:pcces123@localhost:5432/pcces_restore
      PG_DUMP_FILE: /tmp/pcces.dump
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: PostgreSQL empty migration (fail closed)
        run: PYTHONPATH=. python scripts/pg_migration.py --verify --expect-empty
      - name: PostgreSQL domain smoke test
        run: PYTHONPATH=. python scripts/pg_smoke_test.py
      - name: PostgreSQL upgrade and idempotency
        run: PYTHONPATH=. python scripts/pg_upgrade_verify.py
      - name: PostgreSQL pg_dump
        run: |
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file="$PG_DUMP_FILE"
          test -s "$PG_DUMP_FILE"
          sha256sum "$PG_DUMP_FILE"
      - name: PostgreSQL restore into clean database
        run: |
          dropdb --if-exists -h localhost -U pcces pcces_restore
          createdb -h localhost -U pcces pcces_restore
          pg_restore -h localhost -U pcces -d pcces_restore --no-owner --no-privileges "$PG_DUMP_FILE"
      - name: PostgreSQL restored database verification
        run: PYTHONPATH=. python scripts/pg_restore_verify.py

  roundtrip-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Round-trip tests
        run: >-
          PYTHONPATH=. python -m unittest
          api.test_exchange_roundtrip_contract
          api.test_bid_budget_roundtrip
          api.test_bid_budget_import_apply
          api.test_conversion_export_jobs
          api.test_conversion_export_lifecycle
          api.test_phase4_roundtrip_audit
      - name: Golden fixture tests
        run: >-
          PYTHONPATH=. python -m unittest
          api.test_shared_golden
          api.test_authorization_golden
          api.test_budget_decimal
          api.test_decimal_math
          api.test_budget_kind_engine
      - name: Phase 9 golden gate
        run: PYTHONPATH=. python scripts/phase9_gate.py --require-complete

  full-stack-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build full stack
        run: docker compose build
      - name: Start full stack
        run: docker compose up -d
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/api/health >/tmp/flask-health.json \
              && curl -fsS http://localhost:8080/api/health >/tmp/go-health.json \
              && curl -fsS http://localhost:4173/ >/tmp/frontend.html; then
              cat /tmp/flask-health.json
              cat /tmp/go-health.json
              grep -q '<div id="root"' /tmp/frontend.html
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Frontend API proxy smoke
        run: curl -fsS http://localhost:4173/api/health
      - name: Install Playwright E2E dependencies
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run browser full-stack E2E
        working-directory: e2e
        env:
          PCCES_E2E_BASE_URL: http://127.0.0.1:4173
          PCCES_GO_BASE_URL: http://127.0.0.1:8080
        run: npm test
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-stack-evidence
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
      - name: Container status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color > /tmp/pcces-compose.log
          tail -n 400 /tmp/pcces-compose.log
      - name: Stop full stack
        if: always()
        run: docker compose down -v
