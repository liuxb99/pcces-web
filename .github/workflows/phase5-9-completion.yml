name: Phase 5-9 Completion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          PYTHONPATH=. python -m unittest
          api.test_contract_core
          api.test_contract_allocation
          api.test_contract_governance
          api.test_contract_change_governance
          api.test_contract_execution
          api.test_report_center
          api.test_report_job_lifecycle
          api.test_admin_console
      - run: PYTHONPATH=. python scripts/phase9_legacy_catalog.py --require-no-unknown
      - run: PYTHONPATH=. python scripts/production_readiness.py
      - run: PYTHONPATH=. python scripts/phase9_gate.py --require-complete
      - uses: actions/upload-artifact@v4
        with:
          name: phase9-legacy-catalog
          path: build/phase9-legacy-catalog.json

  local-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcces-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: pcces-go/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-pcces/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-pcces/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  postgresql-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcces
          POSTGRES_PASSWORD: pcces123
          POSTGRES_DB: pcces
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pcces:pcces123@localhost:5432/pcces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: PostgreSQL empty migration
        run: PYTHONPATH=. python scripts/pg_migration.py --verify
      - name: PostgreSQL smoke test
        run: PYTHONPATH=. python scripts/pg_smoke_test.py

  roundtrip-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Round-trip tests
        run: >-
          PYTHONPATH=. python -m unittest
          api.test_bid_budget_roundtrip
          api.test_bid_budget_import_apply
          api.test_conversion_export_jobs
          api.test_conversion_export_lifecycle
          api.test_phase4_roundtrip_audit
      - name: Golden fixture tests
        run: >-
          PYTHONPATH=. python -m unittest
          api.test_authorization_golden
          api.test_budget_decimal
          api.test_decimal_math
          api.test_budget_kind_engine
      - name: Phase 9 golden gate
        run: PYTHONPATH=. python scripts/phase9_gate.py --require-complete
