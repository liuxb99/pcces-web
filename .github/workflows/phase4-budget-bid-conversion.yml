name: Phase 4 Budget Bid Conversion

on:
  workflow_dispatch:

jobs:
  web-conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          python -m unittest
          api.test_budget_bid_conversion
          api.test_conversion_wizard
          api.test_conversion_export_jobs
          api.test_conversion_export_lifecycle
          api.test_conversion_source_artifacts
          api.test_conversion_long_jobs
          api.test_bid_budget_roundtrip
          api.test_bid_import_canonical_contract
          api.test_bid_budget_import_apply
          api.test_bid_import_apply_canonical_contract
          api.test_budget_combine_bid
          api.test_budget_combine_bid_contract
          api.test_legacy_exchange_adapters

  go-conversion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcces-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: pcces-go/go.sum
      - name: Format check
        run: test -z "$(gofmt -l internal/storage/sqlite/budget_bid_conversion*.go internal/storage/sqlite/conversion_wizard*.go internal/storage/sqlite/conversion_export*.go internal/storage/sqlite/conversion_source_artifacts*.go internal/storage/sqlite/conversion_long_jobs*.go internal/storage/sqlite/bid_import_roundtrip*.go internal/storage/sqlite/bid_import_sessions.go internal/storage/sqlite/bid_import_apply.go internal/storage/sqlite/combine_bid*.go internal/storage/sqlite/legacy_exchange*.go internal/platform/httpapi/budget_bid_conversion_handlers.go internal/platform/httpapi/conversion_wizard_handlers.go internal/platform/httpapi/conversion_export_job_handlers.go internal/platform/httpapi/conversion_source_artifact_handlers.go internal/platform/httpapi/conversion_long_job_handlers.go internal/platform/httpapi/bid_import_roundtrip_handlers.go internal/platform/httpapi/bid_import_apply_handlers.go internal/platform/httpapi/combine_bid_handlers.go internal/platform/httpapi/legacy_exchange_adapter_handlers.go internal/platform/httpapi/authorization_handlers.go)"
      - run: go test ./internal/storage/sqlite/... ./internal/platform/httpapi/...
      - run: go vet ./...
