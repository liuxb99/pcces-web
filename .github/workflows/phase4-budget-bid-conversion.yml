name: Phase 4 Budget Bid Conversion

on:
  push:
    branches: [main]
    paths:
      - "api/budget_bid_conversion.py"
      - "api/test_budget_bid_conversion.py"
      - "api/app.py"
      - "pcces-go/internal/storage/sqlite/budget_bid_conversion*"
      - "pcces-go/internal/storage/sqlite/migrations/0028_budget_bid_conversion.sql"
      - "pcces-go/internal/platform/httpapi/budget_bid_conversion_handlers.go"
      - "pcces-go/internal/platform/httpapi/authorization_handlers.go"
      - ".github/workflows/phase4-budget-bid-conversion.yml"
  pull_request:
    paths:
      - "api/budget_bid_conversion.py"
      - "api/test_budget_bid_conversion.py"
      - "api/app.py"
      - "pcces-go/internal/storage/sqlite/budget_bid_conversion*"
      - "pcces-go/internal/storage/sqlite/migrations/0028_budget_bid_conversion.sql"
      - "pcces-go/internal/platform/httpapi/budget_bid_conversion_handlers.go"
      - "pcces-go/internal/platform/httpapi/authorization_handlers.go"
  workflow_dispatch:

jobs:
  web-conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest api.test_budget_bid_conversion

  go-conversion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcces-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: pcces-go/go.sum
      - name: Format check
        run: test -z "$(gofmt -l internal/storage/sqlite/budget_bid_conversion*.go internal/platform/httpapi/budget_bid_conversion_handlers.go internal/platform/httpapi/authorization_handlers.go)"
      - run: go test ./internal/storage/sqlite/... ./internal/platform/httpapi/...
      - run: go vet ./...
