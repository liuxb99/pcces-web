name: Phase 4 Budget Bid Conversion

on:
  push:
    branches: [main]
    paths:
      - "api/budget_bid_conversion.py"
      - "api/conversion_wizard.py"
      - "api/conversion_export_jobs.py"
      - "api/conversion_export_lifecycle.py"
      - "api/conversion_source_artifacts.py"
      - "api/bid_budget_roundtrip.py"
      - "api/bid_budget_import_apply.py"
      - "api/budget_combine_bid.py"
      - "api/legacy_exchange_adapters.py"
      - "api/test_budget_bid_conversion.py"
      - "api/test_conversion_wizard.py"
      - "api/test_conversion_export_jobs.py"
      - "api/test_conversion_export_lifecycle.py"
      - "api/test_conversion_source_artifacts.py"
      - "api/test_bid_budget_roundtrip.py"
      - "api/test_bid_import_canonical_contract.py"
      - "api/test_bid_budget_import_apply.py"
      - "api/test_bid_import_apply_canonical_contract.py"
      - "api/test_budget_combine_bid.py"
      - "api/test_budget_combine_bid_contract.py"
      - "api/test_legacy_exchange_adapters.py"
      - "api/app.py"
      - "docs/development/phase4-traceability-matrix.md"
      - "pcces-go/internal/storage/sqlite/budget_bid_conversion*"
      - "pcces-go/internal/storage/sqlite/conversion_wizard*"
      - "pcces-go/internal/storage/sqlite/conversion_export*"
      - "pcces-go/internal/storage/sqlite/conversion_source_artifacts*"
      - "pcces-go/internal/storage/sqlite/bid_import_roundtrip*"
      - "pcces-go/internal/storage/sqlite/bid_import_sessions.go"
      - "pcces-go/internal/storage/sqlite/bid_import_apply.go"
      - "pcces-go/internal/storage/sqlite/combine_bid*"
      - "pcces-go/internal/storage/sqlite/legacy_exchange*"
      - "pcces-go/internal/storage/sqlite/migrations/0028_budget_bid_conversion.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0029_conversion_wizard.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0030_conversion_export_jobs.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0031_conversion_export_artifact_versions.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0032_bid_import_roundtrip.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0033_bid_import_apply.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0034_combine_bid_sessions.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0035_legacy_exchange_adapters.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0036_conversion_source_artifacts.sql"
      - "pcces-go/internal/platform/httpapi/*conversion*"
      - "pcces-go/internal/platform/httpapi/bid_import*"
      - "pcces-go/internal/platform/httpapi/combine_bid_handlers.go"
      - "pcces-go/internal/platform/httpapi/legacy_exchange_adapter_handlers.go"
      - "pcces-go/internal/platform/httpapi/authorization_handlers.go"
      - ".github/workflows/phase4-budget-bid-conversion.yml"
  pull_request:
    paths:
      - "api/conversion_export_jobs.py"
      - "api/conversion_source_artifacts.py"
      - "api/test_conversion_source_artifacts.py"
      - "docs/development/phase4-traceability-matrix.md"
      - "pcces-go/internal/storage/sqlite/conversion_source_artifacts*"
      - "pcces-go/internal/storage/sqlite/migrations/0036_conversion_source_artifacts.sql"
      - "pcces-go/internal/platform/httpapi/conversion_source_artifact_handlers.go"
      - "pcces-go/internal/platform/httpapi/authorization_handlers.go"
      - ".github/workflows/phase4-budget-bid-conversion.yml"
  workflow_dispatch:

jobs:
  web-conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          python -m unittest
          api.test_budget_bid_conversion
          api.test_conversion_wizard
          api.test_conversion_export_jobs
          api.test_conversion_export_lifecycle
          api.test_conversion_source_artifacts
          api.test_bid_budget_roundtrip
          api.test_bid_import_canonical_contract
          api.test_bid_budget_import_apply
          api.test_bid_import_apply_canonical_contract
          api.test_budget_combine_bid
          api.test_budget_combine_bid_contract
          api.test_legacy_exchange_adapters

  go-conversion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcces-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: pcces-go/go.sum
      - name: Format check
        run: test -z "$(gofmt -l internal/storage/sqlite/budget_bid_conversion*.go internal/storage/sqlite/conversion_wizard*.go internal/storage/sqlite/conversion_export*.go internal/storage/sqlite/conversion_source_artifacts*.go internal/storage/sqlite/bid_import_roundtrip*.go internal/storage/sqlite/bid_import_sessions.go internal/storage/sqlite/bid_import_apply.go internal/storage/sqlite/combine_bid*.go internal/storage/sqlite/legacy_exchange*.go internal/platform/httpapi/budget_bid_conversion_handlers.go internal/platform/httpapi/conversion_wizard_handlers.go internal/platform/httpapi/conversion_export_job_handlers.go internal/platform/httpapi/conversion_source_artifact_handlers.go internal/platform/httpapi/bid_import_roundtrip_handlers.go internal/platform/httpapi/bid_import_apply_handlers.go internal/platform/httpapi/combine_bid_handlers.go internal/platform/httpapi/legacy_exchange_adapter_handlers.go internal/platform/httpapi/authorization_handlers.go)"
      - run: go test ./internal/storage/sqlite/... ./internal/platform/httpapi/...
      - run: go vet ./...
