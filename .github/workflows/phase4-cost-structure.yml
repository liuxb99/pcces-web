name: Phase 4 Cost Structure

on:
  push:
    branches: [main]
    paths:
      - "api/cost_structure*.py"
      - "api/test_cost_structure*.py"
      - "api/app.py"
      - "pcces-go/internal/storage/sqlite/cost_structure*"
      - "pcces-go/internal/storage/sqlite/migrations/0024_cost_structure.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0025_cost_structure_details.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0026_cost_structure_runs.sql"
      - "pcces-go/internal/platform/httpapi/cost_structure*"
      - "pcces-go/internal/platform/httpapi/authorization_handlers.go"
      - ".github/workflows/phase4-cost-structure.yml"
  pull_request:
    paths:
      - "api/cost_structure*.py"
      - "api/test_cost_structure*.py"
      - "api/app.py"
      - "pcces-go/internal/storage/sqlite/cost_structure*"
      - "pcces-go/internal/storage/sqlite/migrations/0024_cost_structure.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0025_cost_structure_details.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0026_cost_structure_runs.sql"
      - "pcces-go/internal/platform/httpapi/cost_structure*"
      - "pcces-go/internal/platform/httpapi/authorization_handlers.go"
  workflow_dispatch:

jobs:
  web-cost-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          python -m unittest
          api.test_cost_structure
          api.test_cost_structure_details
          api.test_cost_structure_calculation
          api.test_cost_structure_project_run

  go-cost-structure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcces-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: pcces-go/go.sum
      - name: Format check
        run: test -z "$(gofmt -l internal/storage/sqlite/cost_structure*.go internal/platform/httpapi/cost_structure*.go internal/platform/httpapi/authorization_handlers.go)"
      - run: go test ./internal/storage/sqlite/... ./internal/platform/httpapi/...
      - run: go vet ./...
