name: Phase 0 Cross-Target Parity

on:
  workflow_dispatch:

jobs:
  web-phase0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run Web Phase 0 tests
        run: >-
          python -m unittest
          api.test_authorization
          api.test_canonical_entrypoint
          api.test_route_policy
          api.test_authorization_golden
          api.test_work_context
          api.test_recovery

  go-phase0:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcces-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: pcces-go/go.sum
      - name: Format check
        run: test -z "$(gofmt -l internal/domain/authorization internal/domain/workcontext internal/storage/sqlite internal/platform/httpapi)"
      - name: Run Go Phase 0 tests
        run: go test ./internal/domain/workcontext/... ./internal/storage/sqlite/... ./internal/platform/httpapi/...
      - name: Run Go vet
        run: go vet ./...
