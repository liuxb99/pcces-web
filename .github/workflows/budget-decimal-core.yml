name: Budget Decimal Core

on:
  push:
    paths:
      - "api/budget_decimal.py"
      - "api/test_budget_decimal.py"
      - "api/decimal_math.py"
      - "api/app.py"
      - "pcces-go/internal/domain/money/**"
      - "pcces-go/internal/storage/sqlite/migrations/0007_budget_decimal_core.sql"
      - "specs/golden/budget-decimal-calculations.json"
      - ".github/workflows/budget-decimal-core.yml"
  pull_request:
    paths:
      - "api/budget_decimal.py"
      - "api/test_budget_decimal.py"
      - "api/decimal_math.py"
      - "api/app.py"
      - "pcces-go/internal/domain/money/**"
      - "pcces-go/internal/storage/sqlite/migrations/0007_budget_decimal_core.sql"
      - "specs/golden/budget-decimal-calculations.json"

jobs:
  web-budget-decimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest api.test_decimal_math api.test_budget_decimal

  go-budget-decimal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcces-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: pcces-go/go.sum
      - run: test -z "$(gofmt -l internal/domain/money)"
      - run: go test ./internal/domain/money/... ./internal/storage/sqlite/...
      - run: go vet ./...
