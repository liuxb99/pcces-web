name: Budget Decimal Core

on:
  push:
    paths:
      - "api/budget_decimal.py"
      - "api/budget_kind_engine.py"
      - "api/budget_calculation_trace.py"
      - "api/legacy_budget_decimal_bridge.py"
      - "api/legacy_decimal_adapter.py"
      - "api/test_budget_decimal.py"
      - "api/test_budget_kind_engine.py"
      - "api/test_budget_calculation_trace.py"
      - "api/test_legacy_budget_decimal_bridge.py"
      - "api/test_legacy_decimal_adapter.py"
      - "api/decimal_math.py"
      - "api/app.py"
      - "pcces-go/internal/domain/money/**"
      - "pcces-go/internal/storage/sqlite/budget_trace_repository*.go"
      - "pcces-go/internal/storage/sqlite/migrations/0007_budget_decimal_core.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0009_budget_calculation_traces.sql"
      - "pcces-go/internal/platform/httpapi/decimal_core_handlers.go"
      - "specs/golden/budget-decimal-calculations.json"
      - "specs/golden/budget-item-kind-calculations.json"
      - ".github/workflows/budget-decimal-core.yml"
  pull_request:
    paths:
      - "api/budget_decimal.py"
      - "api/budget_kind_engine.py"
      - "api/budget_calculation_trace.py"
      - "api/legacy_budget_decimal_bridge.py"
      - "api/legacy_decimal_adapter.py"
      - "api/test_budget_decimal.py"
      - "api/test_budget_kind_engine.py"
      - "api/test_budget_calculation_trace.py"
      - "api/test_legacy_budget_decimal_bridge.py"
      - "api/test_legacy_decimal_adapter.py"
      - "api/decimal_math.py"
      - "api/app.py"
      - "pcces-go/internal/domain/money/**"
      - "pcces-go/internal/storage/sqlite/budget_trace_repository*.go"
      - "pcces-go/internal/storage/sqlite/migrations/0007_budget_decimal_core.sql"
      - "pcces-go/internal/storage/sqlite/migrations/0009_budget_calculation_traces.sql"
      - "pcces-go/internal/platform/httpapi/decimal_core_handlers.go"
      - "specs/golden/budget-decimal-calculations.json"
      - "specs/golden/budget-item-kind-calculations.json"
      - ".github/workflows/budget-decimal-core.yml"

jobs:
  web-budget-decimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          python -m unittest
          api.test_decimal_math
          api.test_budget_decimal
          api.test_budget_kind_engine
          api.test_budget_calculation_trace
          api.test_legacy_budget_decimal_bridge
          api.test_legacy_decimal_adapter

  go-budget-decimal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcces-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: pcces-go/go.sum
      - run: test -z "$(gofmt -l internal/domain/money internal/storage/sqlite internal/platform/httpapi)"
      - run: go test ./internal/domain/money/... ./internal/storage/sqlite/... ./internal/platform/httpapi/...
      - run: go vet ./...
