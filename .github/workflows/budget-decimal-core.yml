name: Budget Decimal Core

on:
  workflow_dispatch:

jobs:
  web-budget-decimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          python -m unittest
          api.test_decimal_math
          api.test_budget_decimal
          api.test_budget_kind_engine
          api.test_budget_calculation_trace
          api.test_legacy_budget_decimal_bridge
          api.test_legacy_decimal_adapter

  go-budget-decimal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcces-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: pcces-go/go.sum
      - run: test -z "$(gofmt -l internal/domain/money internal/storage/sqlite internal/platform/httpapi)"
      - run: go test ./internal/domain/money/... ./internal/storage/sqlite/... ./internal/platform/httpapi/...
      - run: go vet ./...
